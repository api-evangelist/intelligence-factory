name: Intelligence Factory
description: Intelligence Factory is a San Francisco robotics and embodied-AI startup (Y Combinator
  Spring 2026) building general-purpose foundation models for robotic manipulation. Its stated mission
  is "Human Intelligence for Robots" — deploying bots with human-level dexterity and reasoning in the
  real world. The team trains models on human demonstration data captured through custom gloves that
  record what a person sees, does, and feels, retargets that human motion onto robot motion, and deploys
  the resulting models across robot platforms from dexterous hands to grippers, with early focus on
  warehouses, grocery stores, and data centers. The company was founded by Yash Sinha (CEO) and Jalaj
  Shukla (CTO), with a team drawn from ETH Zurich, University of Pennsylvania, Harvard, NVIDIA, Formula 1,
  and Ansys. As of this profile it publishes no public API, SDK, developer documentation, or GitHub
  organization — it is an early-stage lead in the API Evangelist network.
